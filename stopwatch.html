<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>스탑워치</title>
<style>
  :root {
    --bg: #f5f5f7;
    --card: #ffffff;
    --text: #1d1d1f;
    --muted: #86868b;
    --line: #e5e5ea;
    --start: #34c759;
    --stop: #ff3b30;
    --neutral: #d1d1d6;
    --best: #248a3d;
    --worst: #d70015;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #000000;
      --card: #1c1c1e;
      --text: #f5f5f7;
      --muted: #8e8e93;
      --line: #2c2c2e;
      --neutral: #3a3a3c;
      --best: #30d158;
      --worst: #ff453a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", "Malgun Gothic", sans-serif;
    display: flex;
    justify-content: center;
    padding: 48px 16px;
  }
  .app { width: 100%; max-width: 420px; }
  .display {
    font-variant-numeric: tabular-nums;
    font-size: clamp(56px, 18vw, 84px);
    font-weight: 200;
    text-align: center;
    letter-spacing: -1px;
    margin: 24px 0 40px;
  }
  .display .ms { color: var(--muted); }
  .controls {
    display: flex;
    justify-content: space-between;
    margin-bottom: 24px;
  }
  button {
    width: 88px; height: 88px;
    border-radius: 50%;
    border: none;
    font-size: 17px;
    font-weight: 500;
    cursor: pointer;
    color: #fff;
    transition: transform .08s, opacity .2s;
  }
  button:active { transform: scale(.95); }
  button:disabled { opacity: .4; cursor: default; }
  #lapBtn { background: var(--neutral); color: var(--text); }
  #startBtn { background: var(--start); }
  #startBtn.running { background: var(--stop); }
  ul { list-style: none; padding: 0; margin: 0; }
  li {
    display: flex;
    justify-content: space-between;
    padding: 14px 4px;
    border-top: 1px solid var(--line);
    font-variant-numeric: tabular-nums;
    font-size: 17px;
  }
  li:last-child { border-bottom: 1px solid var(--line); }
  li.best { color: var(--best); }
  li.worst { color: var(--worst); }
  .hint {
    margin-top: 24px;
    text-align: center;
    color: var(--muted);
    font-size: 13px;
  }
  kbd {
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 1px 6px;
    font-family: inherit;
  }
</style>
</head>
<body>
<main class="app">
  <div class="display" id="display">00:00<span class="ms">.00</span></div>
  <div class="controls">
    <button id="lapBtn" disabled>랩</button>
    <button id="startBtn">시작</button>
  </div>
  <ul id="laps"></ul>
  <p class="hint"><kbd>Space</kbd> 시작/정지 · <kbd>L</kbd> 랩 · <kbd>R</kbd> 재설정</p>
</main>

<script>
  const display = document.getElementById('display');
  const startBtn = document.getElementById('startBtn');
  const lapBtn = document.getElementById('lapBtn');
  const lapsEl = document.getElementById('laps');

  let running = false;
  let startTime = 0;   // performance.now() 기준 시작 시각
  let elapsed = 0;     // 정지 시점까지 누적된 시간(ms)
  let lapStart = 0;    // 현재 랩 시작 시점의 총 경과 시간
  let laps = [];       // 각 랩의 소요 시간(ms)
  let rafId = null;

  function now() {
    return running ? elapsed + (performance.now() - startTime) : elapsed;
  }

  function format(ms, html = false) {
    const totalCs = Math.floor(ms / 10);
    const cs = totalCs % 100;
    const totalSec = Math.floor(totalCs / 100);
    const s = totalSec % 60;
    const m = Math.floor(totalSec / 60) % 60;
    const h = Math.floor(totalSec / 3600);
    const pad = n => String(n).padStart(2, '0');
    const main = (h ? h + ':' : '') + pad(m) + ':' + pad(s);
    const frac = '.' + pad(cs);
    return html ? main + '<span class="ms">' + frac + '</span>' : main + frac;
  }

  function tick() {
    const t = now();
    display.innerHTML = format(t, true);
    const current = lapsEl.querySelector('li.current span:last-child');
    if (current) current.textContent = format(t - lapStart);
    rafId = requestAnimationFrame(tick);
  }

  function renderLaps() {
    lapsEl.innerHTML = '';
    const hasTime = running || elapsed > 0;
    if (hasTime) {
      const li = document.createElement('li');
      li.className = 'current';
      li.innerHTML = `<span>랩 ${laps.length + 1}</span><span>${format(now() - lapStart)}</span>`;
      lapsEl.appendChild(li);
    }
    let min = -1, max = -1;
    if (laps.length >= 2) {
      min = laps.indexOf(Math.min(...laps));
      max = laps.indexOf(Math.max(...laps));
    }
    for (let i = laps.length - 1; i >= 0; i--) {
      const li = document.createElement('li');
      if (i === min) li.className = 'best';
      if (i === max) li.className = 'worst';
      li.innerHTML = `<span>랩 ${i + 1}</span><span>${format(laps[i])}</span>`;
      lapsEl.appendChild(li);
    }
  }

  function updateButtons() {
    startBtn.textContent = running ? '정지' : '시작';
    startBtn.classList.toggle('running', running);
    if (running) {
      lapBtn.textContent = '랩';
      lapBtn.disabled = false;
    } else {
      lapBtn.textContent = '재설정';
      lapBtn.disabled = elapsed === 0;
      if (elapsed === 0) lapBtn.textContent = '랩';
    }
  }

  function toggle() {
    if (running) {
      elapsed = now();
      running = false;
      cancelAnimationFrame(rafId);
      display.innerHTML = format(elapsed, true);
    } else {
      startTime = performance.now();
      running = true;
      rafId = requestAnimationFrame(tick);
    }
    updateButtons();
    renderLaps();
  }

  function lap() {
    if (!running) return;
    const t = now();
    laps.push(t - lapStart);
    lapStart = t;
    renderLaps();
  }

  function reset() {
    if (running) return;
    elapsed = 0;
    lapStart = 0;
    laps = [];
    display.innerHTML = format(0, true);
    renderLaps();
    updateButtons();
  }

  startBtn.addEventListener('click', toggle);
  lapBtn.addEventListener('click', () => running ? lap() : reset());

  document.addEventListener('keydown', e => {
    if (e.repeat) return;
    if (e.code === 'Space') { e.preventDefault(); toggle(); }
    else if (e.key === 'l' || e.key === 'L') lap();
    else if (e.key === 'r' || e.key === 'R') reset();
  });

  updateButtons();
</script>
</body>
</html>
